# JitPack builds a git tag (e.g. 0.3.0) and serves the result as
#   com.qartvelo.ads:core:<tag>
#   com.qartvelo.ads:admob:<tag>
# com.qartvelo comes from the git.qartvelo.com TXT record (-> github.com/Qartvelo-com);
# android/build.gradle.kts builds the group from GROUP/ARTIFACT, which JitPack sets.
jdk:
  - openjdk17
install:
  - cd android && ./gradlew :qartvelo-ads-core:publishToMavenLocal :qartvelo-ads-admob:publishToMavenLocal --no-daemon
