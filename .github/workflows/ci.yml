name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and builds
        run: ./gradlew :qartvelo-ads-core:testDebugUnitTest :qartvelo-ads-admob:testDebugUnitTest :sample-app:assembleDebug assembleRelease
      - name: Maven Central bundle (unsigned)
        run: |
          ./gradlew :qartvelo-ads-core:publishAllPublicationsToStagingRepository :qartvelo-ads-admob:publishAllPublicationsToStagingRepository
          find build/staging-deploy -type f -not -name '*.md5' -not -name '*.sha*' | sort
          for a in core admob; do
            for f in .aar .pom .module -sources.jar -javadoc.jar; do
              ls build/staging-deploy/com/qartvelo/ads/$a/*/$a-*$f >/dev/null
            done
          done

  react-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-native/packages/react-native-qartvelo-ads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-native/packages/react-native-qartvelo-ads/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --silent
      - run: npx bob build
