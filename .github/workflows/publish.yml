# Release: started by release.yml when a new version lands on main, or push a tag equal to the
# version by hand (e.g. `git tag 0.3.0 && git push origin 0.3.0`).
# - Android: com.qartvelo.ads:core / qartvelo-ads-admob to GitHub Packages and, when its
#   secrets are set, Maven Central.
#   JitPack builds the same tag on first request (see jitpack.yml).
# - npm: @qartvelo/react-native-ads and the docs MCP server @qartvelo/ads-mcp, only when the
#   NPM_TOKEN secret is set.
# Run manually with "mcp_only" to publish just the MCP server between SDK releases.
# The tag must match `version` in android/build.gradle.kts and both npm package.json files.

name: Publish

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      mcp_only:
        description: Publish only @qartvelo/ads-mcp (version from developers/mcp/package.json)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  android:
    if: ${{ !inputs.mcp_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :qartvelo-ads-core:testDebugUnitTest :qartvelo-ads-admob:testDebugUnitTest
      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :qartvelo-ads-core:publishAllPublicationsToGitHubPackagesRepository :qartvelo-ads-admob:publishAllPublicationsToGitHubPackagesRepository
      # Maven Central (Central Portal), only when the MAVEN_CENTRAL_USERNAME / _PASSWORD
      # (Central user token) and SIGNING_KEY / SIGNING_PASSWORD secrets are set.
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$MAVEN_CENTRAL_USERNAME" ] || [ -z "$SIGNING_KEY" ]; then
            echo "Maven Central secrets are not set; skipping."
            exit 0
          fi
          ./gradlew :qartvelo-ads-core:publishAllPublicationsToStagingRepository :qartvelo-ads-admob:publishAllPublicationsToStagingRepository
          version=$(sed -nE 's/^\s*version = "([^"]+)".*/\1/p' build.gradle.kts | head -1)
          (cd build/staging-deploy && zip -qr ../central-bundle.zip . -x '*maven-metadata*')
          auth="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          id=$(curl -sS --fail-with-body -X POST -H "$auth" -F bundle=@build/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=qartvelo-ads-$version&publishingType=AUTOMATIC")
          echo "Deployment $id"
          for i in $(seq 1 60); do
            state=$(curl -sS --fail-with-body -X POST -H "$auth" "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq -r .deploymentState)
            echo "$state"
            case "$state" in
              PUBLISHED|PUBLISHING) exit 0 ;;
              FAILED) curl -sS -X POST -H "$auth" "https://central.sonatype.com/api/v1/publisher/status?id=$id" | jq .; exit 1 ;;
            esac
            sleep 20
          done
          echo "Still validating after 20 minutes; check https://central.sonatype.com/publishing/deployments"

  npm:
    if: ${{ !inputs.mcp_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: react-native/packages/react-native-qartvelo-ads
    steps:
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish @qartvelo/react-native-ads
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci --no-audit --no-fund && npm publish --access public

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: developers/mcp
    steps:
      - uses: actions/checkout@v4
        if: env.NPM_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish @qartvelo/ads-mcp
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci --no-audit --no-fund && npm test && npm publish --access public
